[build-system]
requires = ["setuptools", "wheel", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcg"
version = "0.2.1"
description = "A collection of tools for processing raw simulation data for use in training machine-learned, coarse-grained (CG) force fields using the MLCG library"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = "==3.12.*"
authors = [
    {name = "Félix Musil"},
    {name = "Nick Charron"},
    {name = "Yaoyi Chen"},
    {name = "Atharva Kelkar"},
    {name = "Clark Templeton"},
    {name = "Klara Bonneau"},
    {name = "Aldo S. Pasos-Trejo"},
    {name = "Andrea Guljas"},
    {name = "Jacopo Venturin"},
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aggforce @ git+https://github.com/noegroup/aggforce.git",
    "ase",
    "e3nn==0.5.3",
    "h5py>=3.15.1",
    "ipython",
    "ipywidgets",
    "jsonargparse[signatures]>=4.42.0",
    "matplotlib>=3.10.7",
    "mdtraj>=1.11.0",
    "nglview",
    "natsort>=8.4.0",
    "networkx>=3.3",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "pytorch_lightning>=2.4.0",
    "pyyaml>=6.0.3",
    "ruamel.yaml",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "sympy",
    "seaborn",
    "tensorboard",
    "torch_geometric>=2.6.1",
    "torchist>=1.0.1",
    "torchtnt",
    "tqdm",
    # by mlcg_opt_radius
    "ninja",
    # extra deps for mlcg models
    "mace-torch==0.3.16",
    "nequip==0.12.1",
    "nequip-allegro==0.7.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
cpu = [
    "torch==2.13.0",
    "pyg_lib>=0.7.0",
]
cu126 = [
    "torch==2.13.0",
    "pyg_lib>=0.7.0",
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu12",
    "nvalchemi-toolkit-ops[torch]",
    "openequivariance",
]
cu130 = [
    "torch==2.13.0",
    "pyg_lib>=0.7.0",
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu13",
    "nvalchemi-toolkit-ops[torch]",
    "openequivariance",
]
cu132 = [
    "torch==2.13.0",
    "pyg_lib>=0.7.0",
    "cuequivariance",
    "cuequivariance-torch",
    "cuequivariance-ops-torch-cu13",
    "nvalchemi-toolkit-ops[torch]",
    "openequivariance",
]
# pyg-lib-rocm is a third-party build (github.com/Looong01/pyg-rocm-build) that
# re-publishes the same pyg_lib version for each torch release, so the
# post-release must be pinned together with torch:
#   0.8.0.post1 -> torch 2.13 | 0.8.0.post2 -> torch 2.14
# Builds for torch <= 2.12 (0.6.0.post*, 0.8.0) were compiled with the wrong
# C++ ABI and fail to load (undefined symbol) against the official ROCm torch.
rocm72 = [
    "torch==2.13.0",
    "pyg-lib-rocm==0.8.0.post1",
    "openequivariance",
    "triton-rocm",
]

[dependency-groups]
dev = [
  "black[jupyter]",
  "coverage[toml]",
  "pytest",
  "pytest-split",
]
docs = [
  "sphinx",
  "shibuya",
  "sphinx-autodoc-typehints",
]

[tool.uv.extra-build-dependencies]
mlcg = ["setuptools"]

[tool.setuptools]
package-dir = {"mlcg" = "src/mlcg"}

[tool.setuptools.package-data]
"mlcg.nn" = ["assets/*.pt"]

[project.urls]
Homepage = "https://github.com/ClementiGroup/mlcg"
Issues = "https://github.com/ClementiGroup/mlcg/issues"

[project.scripts]
mlcg-combine_model = "mlcg.scripts.mlcg_combine_model:main"
mlcg-train_h5 = "mlcg.scripts.mlcg_train_h5:main"
mlcg-train_h5_multischeduler = "mlcg.scripts.mlcg_train_h5_multischeduler:main"
mlcg-train = "mlcg.scripts.mlcg_train:main"
mlcg-train_multischeduler = "mlcg.scripts.mlcg_train_multischeduler:main"
mlcg-nvt_langevin = "mlcg.scripts.mlcg_nvt_langevin:main"
mlcg-nvt_pt_langevin = "mlcg.scripts.mlcg_nvt_pt_langevin:main"
mlcg-minimize_energy = "mlcg.scripts.mlcg_minimize_energy:main"

[tool.black]
line-length = 80
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(

)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: slow CLI / system integration tests",
    "unit: fast unit tests",
    "continuity: tests for checking continuity with old checkpoints",
]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.uv]
override-dependencies = ["e3nn==0.5.3"]
# Keep no-build-isolation-package as a fallback: if no pre-built PyG wheel is
# found for this platform, pyg_lib will be built from source and needs
# to see the already-installed torch without build isolation.
no-build-isolation-package = ["pyg_lib"]
index-strategy = "unsafe-best-match"
# unsafe-best-match needed so torch's transitive deps (e.g. nvidia-cudnn-cu12)
# can be resolved across multiple indexes.
# cpu/cu126/cu130/cu132/rocm72 are mutually exclusive: declare conflicts so uv doesn't try
# to resolve them simultaneously and hit conflicting torch indexes.
conflicts = [
    [
        { extra="cpu" },
        { extra="cu126" },
        { extra="cu130" },
        { extra="cu132" },
        { extra="rocm72" },
    ],
]

[tool.uv.sources]
torch = [
    { index="torch-cpu", extra="cpu" },
    { index="torch-cu126", extra="cu126" },
    { index="torch-cu130", extra="cu130" },
    { index="torch-cu132", extra="cu132" },
    { index="torch-rocm72", extra="rocm72" },
]
pyg_lib = [
    { index="pyg-cpu", extra="cpu" },
    { index="pyg-cu126", extra="cu126" },
    { index="pyg-cu130", extra="cu130" },
    { index="pyg-cu132", extra="cu132" },
]
triton-rocm = { index = "torch-rocm72" }

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "torch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.13.0+cpu.html"
format = "flat"

[[tool.uv.index]]
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.13.0+cu126.html"
format = "flat"

[[tool.uv.index]]
name = "pyg-cu130"
url = "https://data.pyg.org/whl/torch-2.13.0+cu130.html"
format = "flat"

[[tool.uv.index]]
name = "pyg-cu132"
url = "https://data.pyg.org/whl/torch-2.13.0+cu132.html"
format = "flat"

[[tool.uv.index]]
name = "torch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
